services:
  - type: worker
    name: personal-telegram-bot
    env: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: USER_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bot-postgres-db
          property: connectionString

databases:
  - name: bot-postgres-db
    plan: free
    databaseName: telegram_bot_db
    user: bot_user
